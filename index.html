<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Strudel AI Live Studio - Algorithmic Music & Live Coding</title>
    <meta name="description" content="Algorithmic music live coding studio using Strudel notation with AI prompting to generate, explain, and tweak music patterns in real time. Runs entirely in your browser." />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!--
      No web-font <link> here on purpose.

      The page previously render-blocked on fonts.googleapis.com, which stalls
      first paint with no network and flatly contradicts "works offline". The
      font stacks in index.css already fall back to ui-monospace / SFMono /
      Menlo / Consolas, which is exactly right for a code-first tool. If you
      want JetBrains Mono specifically, self-host the woff2 next to the bundle
      rather than reintroducing a third-party request.
    -->
    <!-- Relative, not root-absolute: the site is served from a project path
         on GitHub Pages, so /favicon-32.png would 404. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />

    <!--
      iOS ignores the web app manifest entirely. Installation there is Share ->
      Add to Home Screen, and everything about how the installed app looks is
      controlled by these four tags instead.

      `apple-touch-icon` must be its own square PNG: iOS does not read the
      manifest's icons and does not honour `purpose: maskable`, so the padding
      is baked into this file.

      `status-bar-style: black-translucent` puts the page under the status bar,
      which is why `viewport-fit=cover` is on the viewport above and the layout
      pads with `env(safe-area-inset-*)`. Without those two the header would sit
      beneath the clock and the notch.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Strudel AI" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
